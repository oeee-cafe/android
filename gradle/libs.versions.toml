[versions]
agp = "9.4.1"
kotlin = "2.4.20"
core = "1.19.0"
junit = "4.13.2"
orgJson = "20260814"
lifecycle = "2.11.0"
sentry = "6.22.0"
activityCompose = "1.13.0"
fragment = "1.9.0"
composeBom = "2026.09.00"
webkit = "1.17.0"
browser = "1.10.0"
swiperefreshlayout = "1.2.0"
firebaseBom = "34.19.0"
googleServices = "4.5.0"
credentials = "1.6.0"
googleid = "1.2.1"
billing = "9.1.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android has org.json itself; the JVM that runs the unit tests does not.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Web views
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Sign in with Google (Credential Manager)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Selling the Supporter Pack (Play Billing). Its manifest brings the BILLING permission,
# without which Play Console will not let a one-time product be created.
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentry" }
